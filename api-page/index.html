<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manzxy APIs - Anime Style</title>
<link rel="icon" href="/assets/icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu+Mono&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        mc: ['Press Start 2P','monospace'],
        mono: ['Ubuntu Mono','monospace']
      }
    }
  }
}
</script>

<style>
/* Hide scrollbar but keep functionality */
::-webkit-scrollbar{display:none}

/* ===== THEME VAR ===== */
:root{
  --bg:#1b1b1b;
  --panel:rgba(42, 42, 42, 0.95);
  --border:#3f3f3f;
  --text:#e5e7eb;
  --input:rgba(30, 30, 30, 0.95);
  --accent:#3b82f6;
  --success:#22c55e;
  --warning:#eab308;
  --error:#ef4444;
}
body.light{
  --bg:#e5e7eb;
  --panel:rgba(243, 244, 246, 0.95);
  --border:#cbd5e1;
  --text:#111827;
  --input:rgba(255, 255, 255, 0.95);
  --accent:#3b82f6;
  --success:#16a34a;
  --warning:#ca8a04;
  --error:#dc2626;
}

/* ===== GLOBAL ===== */
html,body{
  margin:0;
  padding:0;
  min-height:100vh;
}

/* Simple Anime Background - No blur effects */
body {
  background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
              url('https://c.termai.cc/i199/f6HGr.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--text);
}

body.light {
  background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)),
              url('https://c.termai.cc/i199/f6HGr.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

/* Minimal transitions - only for interactive elements */
button, .api-item, .mc-btn, .mc-btn-curl, .mc-btn-copy {
  transition: all 0.1s ease;
}

/* ===== BLOCK ===== */
.mc-panel{
  background:var(--panel);
  border:4px solid var(--border);
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.4),
    inset 4px 4px 0 rgba(255,255,255,.05);
}

/* ===== FORCE PANEL COLOR ===== */
.category-group,
.category-group > div,
.category-group button,
.api-item,
.api-item button,
#endpoint-content,
#endpoint-content > div{
  background:transparent !important;
  border-color:var(--border) !important;
  color:var(--text) !important;
}
.category-group button:hover,
.api-item button:hover{
  background:rgba(0,0,0,.2) !important;
}

/* ===== INPUT ===== */
.mc-input{
  background:var(--input);
  border:3px solid var(--border);
  color:var(--text);
}
.mc-input:focus{
  outline: none;
  border-color: var(--accent);
}

/* ===== BUTTON ===== */
.mc-btn{
  background:#3a7d3a;
  border:3px solid #2b5d2b;
  box-shadow:
    inset -3px -3px 0 #1f3f1f,
    inset 3px 3px 0 #5fa75f;
  font-size:10px;
  padding:8px 14px;
  color:#fff;
  cursor: pointer;
}
.mc-btn:active{
  transform: translateY(2px);
  box-shadow:
    inset 3px 3px 0 #1f3f1f,
    inset -3px -3px 0 #5fa75f;
}

/* ===== CLEAR BUTTON ===== */
.mc-btn-clear{
  background:#555;
  border:3px solid #333;
  color:#fff;
  font-size:10px;
  padding:8px 14px;
  cursor: pointer;
}

/* ===== CURL BUTTON ===== */
.mc-btn-curl{
  background:#7d3a7d;
  border:3px solid #5d2b5d;
  box-shadow:
    inset -3px -3px 0 #3f1f3f,
    inset 3px 3px 0 #9f5f9f;
  font-size:10px;
  padding:4px 10px;
  color:#fff;
  cursor: pointer;
}
.mc-btn-curl:active{
  transform: translateY(2px);
  box-shadow:
    inset 3px 3px 0 #3f1f3f,
    inset -3px -3px 0 #9f5f9f;
}

/* ===== COPY BUTTON ===== */
.mc-btn-copy{
  background:#3a5f7d;
  border:3px solid #2b475d;
  box-shadow:
    inset -3px -3px 0 #1f2f3f,
    inset 3px 3px 0 #5f7f9f;
  font-size:10px;
  padding:4px 10px;
  color:#fff;
  cursor: pointer;
}
.mc-btn-copy:active{
  transform: translateY(2px);
  box-shadow:
    inset 3px 3px 0 #1f2f3f,
    inset -3px -3px 0 #5f7f9f;
}

/* ===== GET ===== */
.method-get{
  background:#2563eb;
  border:3px solid #1e40af;
  padding:3px 6px;
  font-size:10px;
  color:#fff;
}

/* ===== RESPONSE ===== */
.mc-response{
  background:#0b0b0b;
  border:3px solid #1f2937;
  color:#22c55e;
}

/* ===== CONTRIBUTORS BACKGROUND ===== */
.bg-bottom{
  background:rgba(0,0,0,0.5);
  border:4px solid var(--border);
  position: relative;
}
.bg-bottom::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url('https://c.termai.cc/i199/f6HGr.jpg') center/cover fixed;
  opacity: 0.3;
  z-index: -1;
}
.bg-bottom > * {
  position: relative;
  z-index: 1;
}

/* ===== LOADER ===== */
.loader {
  border: 2px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 0.8s linear infinite;
  margin: 10px auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== CARD HOVER ===== */
.api-item:hover {
  background:rgba(0,0,0,0.1) !important;
}

/* ===== RESPONSE PRE ===== */
pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 300px;
  overflow-y: auto;
  font-family: 'Ubuntu Mono', monospace;
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
}

/* ===== NO RESULTS ===== */
#noResults {
  text-align: center;
  padding: 40px 20px;
  color: var(--text);
  opacity: 0.7;
  font-size: 12px;
}

/* ===== CURL COMMAND ===== */
.curl-command {
  background:rgba(0,0,0,0.7);
  border:2px solid var(--border);
  padding:6px 10px;
  font-family: 'Ubuntu Mono', monospace;
  font-size: 11px;
  color: #22c55e;
  margin-top: 8px;
  word-break: break-all;
}

/* ===== TOAST NOTIFICATION ===== */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--panel);
  border: 3px solid var(--border);
  padding: 8px 16px;
  color: var(--text);
  font-size: 12px;
  z-index: 9999;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body class="font-mono">

<!-- Toast Notification -->
<div id="toast" class="toast hidden"></div>

<!-- ================= MAIN ================= -->
<div class="max-w-2xl mx-auto px-6 py-10 mc-panel">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <span class="font-mc text-xs">⚡ MANZXY API</span>
  <div class="flex gap-2">
    <button onclick="setTheme('dark')" class="mc-btn">🌙 DARK</button>
    <button onclick="setTheme('light')" class="mc-btn">☀️ LIGHT</button>
  </div>
</div>

<!-- SEARCH -->
<input id="searchInput"
 class="w-full mc-input text-xs mb-6 px-4 py-3"
 placeholder="🔍 Search by path, name, or description..."
 autocomplete="off">

<!-- API LIST -->
<div id="apiList" class="space-y-3"></div>

<!-- NO RESULTS MESSAGE -->
<div id="noResults" class="hidden">
  <span class="material-icons text-4xl mb-2">search_off</span>
  <p>No endpoints found matching your search</p>
</div>

<footer class="mt-10 text-center text-xs opacity-60">
© 2025 Manzxy • <span id="endpoint-count">0</span> endpoints available
</footer>

</div>

<!-- ================= CONTRIBUTORS ================= -->
<div class="max-w-2xl mx-auto px-6 pb-16 mc-panel bg-bottom">

<h2 class="font-mc text-xs text-center opacity-80 mb-6">
👥 CONTRIBUTORS
</h2>

<div class="space-y-4">

<div class="mc-panel flex items-center gap-4 p-4">
  <img src="https://c.termai.cc/i151/YU4EKRg.jpg" class="w-14 h-14 rounded border-2 border-[var(--border)]">
  <div class="flex-1">
    <div class="text-xs font-bold">Manzxy</div>
    <div class="text-[10px] opacity-70">Lead Developer</div>
  </div>
  <a href="https://t.me/manzxyyx" class="hover:opacity-80" target="_blank"><i class="fab fa-telegram text-lg"></i></a>
  <a href="https://github.com/manzxy" class="hover:opacity-80" target="_blank"><i class="fab fa-github text-lg"></i></a>
</div>

</div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
// Toast notification function
function showToast(message, duration = 2000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.remove('hidden');
  
  setTimeout(() => {
    toast.classList.add('hidden');
  }, duration);
}

// Copy to clipboard function
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('✅ Copied!');
  } catch (err) {
    showToast('❌ Failed');
  }
}

// Generate curl command
function generateCurlCommand(method, path, params) {
  let curlCmd = `curl -X ${method} `;
  
  if (params && Object.keys(params).length > 0) {
    const paramString = new URLSearchParams(params).toString();
    curlCmd += `"${path}?${paramString}"`;
  } else {
    curlCmd += `"${path}"`;
  }
  
  return curlCmd;
}

// Theme management
function setTheme(mode){
  document.body.classList.toggle('light', mode === 'light')
  localStorage.setItem('theme', mode)
}

// Initialize theme
(function initTheme() {
  setTheme(localStorage.getItem('theme') || 'dark')
})();

function toggleCategory(index) {
  const category = document.getElementById(`category-${index}`);
  const icon = document.getElementById(`category-icon-${index}`);
  if (category.classList.contains('hidden')) {
    category.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    category.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

function toggleEndpoint(catIndex, endpointIndex) {
  const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
  const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
  if (endpoint.classList.contains('hidden')) {
    endpoint.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    endpoint.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

function showCurl(catIndex, endpointIndex, method, path) {
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const formData = new FormData(form);
  const params = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) params[key] = value;
  }
  
  const curlCmd = generateCurlCommand(method, path, params);
  
  // Create or update curl display
  let curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  if (!curlDiv) {
    curlDiv = document.createElement('div');
    curlDiv.id = `curl-${catIndex}-${endpointIndex}`;
    curlDiv.className = 'curl-command flex justify-between items-center gap-2';
    
    const curlText = document.createElement('span');
    curlText.className = 'flex-1 font-mono text-[10px]';
    curlText.textContent = curlCmd;
    
    const copyBtn = document.createElement('button');
    copyBtn.className = 'mc-btn-copy text-[8px] px-2 py-1';
    copyBtn.innerHTML = '📋 COPY';
    copyBtn.onclick = () => copyToClipboard(curlCmd);
    
    curlDiv.appendChild(curlText);
    curlDiv.appendChild(copyBtn);
    
    // Insert after form
    const form_element = document.getElementById(`form-${catIndex}-${endpointIndex}`);
    form_element.parentNode.insertBefore(curlDiv, form_element.nextSibling);
  } else {
    curlDiv.querySelector('span').textContent = curlCmd;
    curlDiv.querySelector('button').onclick = () => copyToClipboard(curlCmd);
  }
}

async function executeRequest(event, catIndex, endpointIndex, method, path, produces) {
  event.preventDefault();
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  
  const formData = new FormData(form);
  const params = new URLSearchParams();
  const paramsObj = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) {
      params.append(key, value);
      paramsObj[key] = value;
    }
  }

  const fullPath = `${path}?${params.toString()}`;
  
  // Show curl command
  showCurl(catIndex, endpointIndex, method, path, paramsObj);
  
  responseDiv.classList.remove('hidden');
  responseContent.innerHTML = '<div class="loader"></div>';

  try {
    const response = await fetch(fullPath);
    const contentType = response.headers.get("content-type");
    
    let resultHtml = '';
    let resultText = '';
    
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      resultText = JSON.stringify(data, null, 2);
      resultHtml = `<pre class="mc-response p-4">${resultText}</pre>`;
    } else if (contentType && contentType.startsWith("image/")) {
      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);
      resultHtml = `<img src="${imageUrl}" class="max-w-full h-auto border-2 border-[var(--border)]">`;
      resultText = '[IMAGE DATA]';
    } else {
      const text = await response.text();
      resultText = text;
      resultHtml = `<pre class="mc-response p-4">${text}</pre>`;
    }
    
    // Add copy button to response
    responseContent.innerHTML = `
      <div class="relative">
        <div class="absolute top-2 right-2 z-10">
          <button onclick='copyToClipboard(${JSON.stringify(resultText)})' class="mc-btn-copy text-[8px] px-2 py-1">
            📋 COPY
          </button>
        </div>
        ${resultHtml}
      </div>
    `;
    
  } catch (error) {
    responseContent.innerHTML = `<pre class="mc-response p-4 text-red-400">${error}</pre>`;
  }
  clearButton.classList.remove('hidden');
}

function clearResponse(catIndex, endpointIndex) {
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  const curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  
  responseContent.innerHTML = '';
  responseDiv.classList.add('hidden');
  clearButton.classList.add('hidden');
  
  if (curlDiv) {
    curlDiv.remove();
  }
}

async function loadApis() {
  const apiList = document.getElementById('apiList');
  const endpointCountSpan = document.getElementById('endpoint-count');
  
  try {
    const response = await fetch('/assets/settings.json');
    const data = await response.json();
    
    let html = '';
    let totalEndpoints = 0;
    
    data.categories.forEach((category, catIndex) => {
      totalEndpoints += category.items.length;
      
      html += `
      <div class="category-group" data-category="${category.name}">
          <div class="mb-2">
              <div class="bg-gray-800 border border-gray-700">
                  <button onclick="toggleCategory(${catIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700">
                      <h2 class="font-bold flex items-center">
                          <span class="material-icons text-lg mr-3 text-gray-400">folder</span>
                          <span class="truncate max-w-xs text-sm">${category.name}</span>
                          <span class="ml-2 text-xs text-gray-500">(${category.items.length})</span>
                      </h2>
                      <span class="material-icons" id="category-icon-${catIndex}">expand_more</span>
                  </button>
                  
                  <div id="category-${catIndex}" class="hidden">`;
      
      category.items.forEach((item, endpointIndex) => {
        const method = 'GET';
        const pathParts = item.path.split('?');
        const path = pathParts[0];
        const queryParams = new URLSearchParams(pathParts[1] || '');

        const statusColors = {
          'ready': 'bg-green-500/20 text-green-400',
          'update': 'bg-yellow-500/20 text-yellow-400',
          'error': 'bg-red-500/20 text-red-400'
        };
        const statusClass = statusColors[item.status] || 'bg-gray-600';

        html += `
              <div class="border-t border-gray-700 api-item" 
                   data-method="${method}"
                   data-path="${path}"
                   data-alias="${item.name}"
                   data-description="${item.desc}"
                   data-category="${category.name}">
                  <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700">
                      <div class="flex items-center min-w-0 flex-1">
                          <span class="inline-block px-3 py-1 text-xs font-semibold text-white mr-3 flex-shrink-0 bg-blue-600 border-2 border-blue-800">
                              ${method}
                          </span>
                          <div class="flex flex-col min-w-0 flex-1">
                              <span class="font-semibold truncate max-w-[90%] font-mono text-sm" title="${path}">${path}</span>
                              <div class="flex items-center gap-2 mt-1">
                                  <span class="text-xs text-gray-400 truncate max-w-[90%]" title="${item.name}">${item.name}</span>
                                  <span class="px-2 py-0.5 text-xs rounded-full ${statusClass}">${item.status || 'ready'}</span>
                              </div>
                          </div>
                      </div>
                      <span class="material-icons" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
                  </button>
                  
                  <div id="endpoint-${catIndex}-${endpointIndex}" class="hidden bg-gray-800 p-4 border-t border-gray-700">
                      <div class="mb-3">
                          <div class="text-gray-400 text-xs leading-relaxed">${item.desc}</div>
                      </div>`;
                      
        if (item.status === 'ready') {
          html += `
                      <div>
                          <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                              <span class="material-icons text-sm mr-1">play_arrow</span>
                              TRY IT OUT
                          </div>
                          <div>
                              <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}', 'application/json')">
                                  <div class="mb-4 space-y-3">`;
                                  
          if (item.params) {
            Object.keys(item.params).forEach(paramName => {
              const isRequired = !queryParams.has(paramName) || queryParams.get(paramName) === '';
              html += `<div>
                          <label class="block text-xs font-medium text-slate-400 mb-1">${paramName} ${isRequired ? '<span class="text-red-500">*</span>' : ''}</label>
                          <input type="text" name="${paramName}" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-blue-500 bg-gray-700" placeholder="${item.params[paramName]}" ${isRequired ? 'required' : ''}>
                        </div>`;
            });
          }
          
          html += `
                                  </div>
                                  <div class="flex flex-wrap gap-2">
                                      <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 text-xs font-medium border-2 border-blue-800">
                                          Execute
                                      </button>
                                      <button type="button" onclick="showCurl(${catIndex}, ${endpointIndex}, '${method}', '${path}')" class="mc-btn-curl">
                                          🔗 CURL
                                      </button>
                                      <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="hidden bg-gray-700 border border-gray-600 text-slate-300 px-6 py-2 text-xs font-medium">
                                          Clear
                                      </button>
                                  </div>
                              </form>
                          </div>
                      </div>`;
        } else {
          html += `<div class="text-yellow-400 text-xs p-3 bg-yellow-500/20 border border-yellow-500/30">⚠️ Endpoint ini tidak dapat diuji coba saat ini.</div>`;
        }

        html += `
                      <div id="response-${catIndex}-${endpointIndex}" class="hidden mt-4">
                          <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                              <span class="material-icons text-sm mr-1">code</span>
                              RESPONSE
                          </div>
                          <div class="bg-gray-900 text-white text-xs border border-gray-700">
                              <div class="max-h-80 overflow-auto" id="response-content-${catIndex}-${endpointIndex}"></div>
                          </div>
                      </div>
                  </div>
              </div>`;
      });
      
      html += `</div></div></div>`;
    });
    
    apiList.innerHTML = html;
    if (endpointCountSpan) endpointCountSpan.textContent = totalEndpoints;
    
  } catch (error) {
    apiList.innerHTML = '<div class="text-red-500 text-center p-4 border border-red-500/30">❌ Failed to load API data. Please refresh.</div>';
    console.error('Error loading API data:', error);
  }
}

// Search functionality
document.addEventListener('DOMContentLoaded', () => {
  loadApis();
  
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase().trim();
      const apiItems = document.querySelectorAll('.api-item');
      const categories = document.querySelectorAll('.category-group');
      const noResults = document.getElementById('noResults');
      let visibleCount = 0;

      apiItems.forEach(item => {
        const path = (item.dataset.path || '').toLowerCase();
        const alias = (item.dataset.alias || '').toLowerCase();
        const description = (item.dataset.description || '').toLowerCase();
        const category = (item.dataset.category || '').toLowerCase();
        
        const matches = path.includes(searchTerm) || 
                       alias.includes(searchTerm) || 
                       description.includes(searchTerm) ||
                       category.includes(searchTerm);
        
        if (matches || searchTerm === '') {
          item.style.display = '';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      categories.forEach(category => {
        const visibleItems = category.querySelectorAll('.api-item[style=""]');
        category.style.display = visibleItems.length > 0 ? '' : 'none';
      });

      noResults.style.display = visibleCount === 0 && searchTerm !== '' ? 'block' : 'none';
    });
  }
});
</script>

</body>
</html>
