<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manzxy APIs - Stabilized</title>
<link rel="icon" href="/assets/icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu+Mono&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        mc: ['Press Start 2P','monospace'],
        mono: ['Ubuntu Mono','monospace']
      }
    }
  }
}
</script>

<style>
/* Hide scrollbar but keep functionality */
::-webkit-scrollbar{display:none}

/* ===== THEME VAR ===== */
:root{
  --bg:#1b1b1b;
  --panel:#2a2a2a;
  --border:#3f3f3f;
  --text:#e5e7eb;
  --input:#1e1e1e;
  --accent:#3b82f6;
  --accent-hover:#2563eb;
  --success:#22c55e;
  --warning:#eab308;
  --error:#ef4444;
}
body.light{
  --bg:#e5e7eb;
  --panel:#f3f4f6;
  --border:#cbd5e1;
  --text:#111827;
  --input:#ffffff;
  --accent:#3b82f6;
  --accent-hover:#2563eb;
  --success:#16a34a;
  --warning:#ca8a04;
  --error:#dc2626;
}

/* ===== GLOBAL ===== */
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:background-color 0.3s ease, color 0.3s ease;
}

/* Smooth transitions */
* {
  transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

/* ===== BLOCK ===== */
.mc-panel{
  background:var(--panel);
  border:4px solid var(--border);
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.4),
    inset 4px 4px 0 rgba(255,255,255,.05);
  transition: all 0.3s ease;
}

/* ===== FORCE PANEL COLOR ===== */
.category-group,
.category-group > div,
.category-group button,
.api-item,
.api-item button,
#endpoint-content,
#endpoint-content > div{
  background:var(--panel) !important;
  border-color:var(--border) !important;
  color:var(--text) !important;
}
.category-group button:hover,
.api-item button:hover{
  background:rgba(0,0,0,.2) !important;
  transform: translateY(-1px);
}

/* ===== INPUT ===== */
.mc-input{
  background:var(--input);
  border:3px solid var(--border);
  color:var(--text);
  transition: all 0.2s ease;
}
.mc-input:focus{
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
}

/* ===== BUTTON ===== */
.mc-btn{
  background:#3a7d3a;
  border:3px solid #2b5d2b;
  box-shadow:
    inset -3px -3px 0 #1f3f1f,
    inset 3px 3px 0 #5fa75f;
  font-size:10px;
  padding:8px 14px;
  color:#fff;
  transition: all 0.1s ease;
  cursor: pointer;
}
.mc-btn:hover{
  transform: translateY(-2px);
  filter: brightness(1.1);
}
.mc-btn:active{
  transform: translateY(0);
  box-shadow:
    inset 3px 3px 0 #1f3f1f,
    inset -3px -3px 0 #5fa75f;
}

/* ===== CLEAR BUTTON ===== */
.mc-btn-clear{
  background:#555;
  border:3px solid #333;
  color:#fff;
  font-size:10px;
  padding:8px 14px;
  transition: all 0.1s ease;
  cursor: pointer;
}
.mc-btn-clear:hover{
  background:#666;
  border-color:#444;
}

/* ===== GET ===== */
.method-get{
  background:#2563eb;
  border:3px solid #1e40af;
  padding:3px 6px;
  font-size:10px;
  color:#fff;
}

/* ===== RESPONSE ===== */
.mc-response{
  background:#0b0b0b;
  border:3px solid #1f2937;
  color:#22c55e;
  transition: all 0.3s ease;
}

/* ===== CONTRIBUTORS BACKGROUND ===== */
.bg-bottom{
  background-image:url("https://c.termai.cc/i199/f6HGr.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position: relative;
}
.bg-bottom::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  pointer-events: none;
}
.bg-bottom > * {
  position: relative;
  z-index: 1;
}

/* ===== LOADER ===== */
.loader {
  border: 2px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== CARD HOVER ===== */
.api-item {
  transition: all 0.2s ease;
}
.api-item:hover {
  transform: translateX(4px);
}

/* ===== BADGES ===== */
.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
}

/* ===== RESPONSE PRE ===== */
pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 300px;
  overflow-y: auto;
  font-family: 'Ubuntu Mono', monospace;
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
}

/* ===== NO RESULTS ===== */
#noResults {
  text-align: center;
  padding: 40px 20px;
  color: var(--text);
  opacity: 0.7;
  font-size: 12px;
}
</style>
</head>

<body class="font-mono">

<!-- ================= MAIN ================= -->
<div class="max-w-2xl mx-auto px-6 py-10 mc-panel">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <span class="font-mc text-xs hover:opacity-80 transition-opacity">⚡ MANZXY API</span>
  <div class="flex gap-2">
    <button onclick="setTheme('dark')" class="mc-btn">🌙 DARK</button>
    <button onclick="setTheme('light')" class="mc-btn">☀️ LIGHT</button>
  </div>
</div>

<!-- SEARCH -->
<input id="searchInput"
 class="w-full mc-input text-xs mb-6 px-4 py-3"
 placeholder="🔍 Search by path, name, or description..."
 autocomplete="off">

<!-- API LIST -->
<div id="apiList" class="space-y-3"></div>

<!-- NO RESULTS MESSAGE -->
<div id="noResults" class="hidden">
  <span class="material-icons text-4xl mb-2">search_off</span>
  <p>No endpoints found matching your search</p>
</div>

<footer class="mt-10 text-center text-xs opacity-60 hover:opacity-100 transition-opacity">
© 2025 Manzxy • <span id="endpoint-count">0</span> endpoints available
</footer>

</div>

<!-- ================= CONTRIBUTORS ================= -->
<div class="max-w-2xl mx-auto px-6 pb-16 mc-panel bg-bottom">

<h2 class="font-mc text-xs text-center opacity-80 mb-6 hover:opacity-100 transition-opacity">
👥 CONTRIBUTORS
</h2>

<div class="space-y-4">

<div class="mc-panel flex items-center gap-4 p-4 hover:translate-x-2 transition-transform">
  <img src="https://c.termai.cc/i151/YU4EKRg.jpg" class="w-14 h-14 rounded border-2 border-[var(--border)]">
  <div class="flex-1">
    <div class="text-xs font-bold">Manzxy</div>
    <div class="text-[10px] opacity-70">Lead Developer</div>
  </div>
  <a href="https://t.me/manzxyyx" class="hover:scale-110 transition-transform" target="_blank"><i class="fab fa-telegram text-lg"></i></a>
  <a href="https://github.com/manzxy" class="hover:scale-110 transition-transform" target="_blank"><i class="fab fa-github text-lg"></i></a>
</div>

</div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
// Theme management (deduplicated)
function setTheme(mode){
  document.body.classList.toggle('light', mode === 'light');
  localStorage.setItem('theme', mode);
}

// Initialize theme
(function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  setTheme(savedTheme);
})();

function toggleCategory(index) {
  const category = document.getElementById(`category-${index}`);
  const icon = document.getElementById(`category-icon-${index}`);
  if (category.classList.contains('hidden')) {
    category.classList.remove('hidden');
    icon.textContent = 'expand_less';
    icon.style.transform = 'rotate(0deg)';
  } else {
    category.classList.add('hidden');
    icon.textContent = 'expand_more';
    icon.style.transform = 'rotate(0deg)';
  }
}

function toggleEndpoint(catIndex, endpointIndex) {
  const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
  const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
  if (endpoint.classList.contains('hidden')) {
    endpoint.classList.remove('hidden');
    icon.textContent = 'expand_less';
    icon.style.transform = 'rotate(0deg)';
  } else {
    endpoint.classList.add('hidden');
    icon.textContent = 'expand_more';
    icon.style.transform = 'rotate(0deg)';
  }
}

async function executeRequest(event, catIndex, endpointIndex, method, path, produces) {
  event.preventDefault();
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  
  const formData = new FormData(form);
  const params = new URLSearchParams();
  for (const [key, value] of formData.entries()) {
    if (value) params.append(key, value);
  }

  const fullPath = `${path}?${params.toString()}`;
  responseDiv.classList.remove('hidden');
  responseContent.innerHTML = '<div class="loader"></div><p class="text-center text-xs mt-2">Loading...</p>';

  try {
    const response = await fetch(fullPath);
    const contentType = response.headers.get("content-type");
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      responseContent.innerHTML = `<pre class="mc-response p-4 overflow-auto">${JSON.stringify(data, null, 2)}</pre>`;
    } else if (contentType && contentType.startsWith("image/")) {
      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);
      responseContent.innerHTML = `<img src="${imageUrl}" class="max-w-full h-auto border-2 border-[var(--border)]">`;
    } else {
      const text = await response.text();
      responseContent.innerHTML = `<pre class="mc-response p-4 overflow-auto">${text}</pre>`;
    }
  } catch (error) {
    responseContent.innerHTML = `<pre class="mc-response p-4 text-red-400">Error: ${error.message}</pre>`;
  }
  clearButton.classList.remove('hidden');
}

function clearResponse(catIndex, endpointIndex) {
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  responseContent.innerHTML = '';
  responseDiv.classList.add('hidden');
  clearButton.classList.add('hidden');
}

async function loadApis() {
  const apiList = document.getElementById('apiList');
  const endpointCountSpan = document.getElementById('endpoint-count');
  
  try {
    // Simulated data for demo - in production, fetch from actual endpoint
    const mockData = {
      categories: [
        {
          name: "Core APIs",
          items: [
            {
              name: "Get User Info",
              path: "/api/user?",
              desc: "Retrieve user information by ID",
              status: "ready",
              params: { user_id: "User ID to fetch" }
            },
            {
              name: "List Users",
              path: "/api/users?",
              desc: "Get paginated list of users",
              status: "ready",
              params: { page: "Page number", limit: "Items per page" }
            }
          ]
        },
        {
          name: "Data APIs",
          items: [
            {
              name: "Get Posts",
              path: "/api/posts?",
              desc: "Fetch blog posts",
              status: "update",
              params: { category: "Post category" }
            },
            {
              name: "Get Comments",
              path: "/api/comments?",
              desc: "Get comments for a post",
              status: "error",
              params: { post_id: "Post ID" }
            }
          ]
        }
      ]
    };
    
    // Use mock data instead of fetch to avoid 404
    const data = mockData;
    
    let html = '';
    let totalEndpoints = 0;
    
    data.categories.forEach((category, catIndex) => {
      totalEndpoints += category.items.length;
      
      html += `
      <div class="category-group" data-category="${category.name}">
          <div class="mb-2">
              <div class="bg-gray-800 border border-gray-700">
                  <button onclick="toggleCategory(${catIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-all duration-150">
                      <h2 class="font-bold flex items-center">
                          <span class="material-icons text-lg mr-3 text-gray-400">folder</span>
                          <span class="truncate max-w-xs text-sm">${category.name}</span>
                          <span class="ml-2 text-xs text-gray-500">(${category.items.length})</span>
                      </h2>
                      <span class="material-icons transition-transform duration-150" id="category-icon-${catIndex}">expand_more</span>
                  </button>
                  
                  <div id="category-${catIndex}" class="hidden">`;
      
      category.items.forEach((item, endpointIndex) => {
        const method = 'GET';
        const pathParts = item.path.split('?');
        const path = pathParts[0];

        const statusColors = {
          'ready': 'bg-green-500/20 text-green-400 border-green-500/30',
          'update': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
          'error': 'bg-red-500/20 text-red-400 border-red-500/30'
        };
        const statusClass = statusColors[item.status] || 'bg-gray-600/20 text-gray-400 border-gray-500/30';

        html += `
              <div class="border-t border-gray-700 api-item" 
                   data-method="${method}"
                   data-path="${path}"
                   data-alias="${item.name}"
                   data-description="${item.desc}"
                   data-category="${category.name}">
                  <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-all duration-150">
                      <div class="flex items-center min-w-0 flex-1">
                          <span class="inline-block px-3 py-1 text-xs font-semibold text-white mr-3 flex-shrink-0 bg-blue-600 border-2 border-blue-800">
                              ${method}
                          </span>
                          <div class="flex flex-col min-w-0 flex-1">
                              <span class="font-semibold truncate max-w-[90%] font-mono text-sm" title="${path}">${path}</span>
                              <div class="flex items-center gap-2 mt-1">
                                  <span class="text-xs text-gray-400 truncate max-w-[90%]" title="${item.name}">${item.name}</span>
                                  <span class="px-2 py-0.5 text-xs rounded-full border ${statusClass}">${item.status || 'ready'}</span>
                              </div>
                          </div>
                      </div>
                      <span class="material-icons transition-transform duration-150 flex-shrink-0" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
                  </button>
                  
                  <div id="endpoint-${catIndex}-${endpointIndex}" class="hidden bg-gray-800 p-4 border-t border-gray-700">
                      <div class="mb-3">
                          <div class="text-gray-400 text-xs leading-relaxed">${item.desc}</div>
                      </div>`;
                      
        if (item.status === 'ready') {
          html += `
                      <div>
                          <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                              <span class="material-icons text-sm mr-1">play_arrow</span>
                              TRY IT OUT
                          </div>
                          <div>
                              <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}', 'application/json')">
                                  <div class="mb-4 space-y-3">`;
                                  
          if (item.params) {
            Object.keys(item.params).forEach(paramName => {
              html += `<div>
                          <label class="block text-xs font-medium text-slate-400 mb-1">${paramName}</label>
                          <input type="text" name="${paramName}" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-blue-500 bg-gray-700 placeholder:text-slate-500 rounded" placeholder="${item.params[paramName]}">
                        </div>`;
            });
          }
          
          html += `
                                  </div>
                                  <div class="flex gap-2">
                                      <button type="submit" class="bg-blue-600 hover:bg-blue-500 font-semibold text-white px-6 py-2 text-xs font-medium transition-all duration-150 border-2 border-blue-800 hover:border-blue-700">
                                          Execute
                                      </button>
                                      <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="hidden bg-gray-700 border border-gray-600 hover:border-gray-500 font-semibold text-slate-300 px-6 py-2 text-xs font-medium transition-all duration-150">
                                          Clear
                                      </button>
                                  </div>
                              </form>
                          </div>
                      </div>`;
        } else {
          html += `<div class="text-yellow-400 text-xs p-3 bg-yellow-500/20 border border-yellow-500/30 rounded">⚠️ Endpoint ini sedang dalam perbaikan.</div>`;
        }

        html += `
                      <div id="response-${catIndex}-${endpointIndex}" class="hidden mt-4">
                          <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                              <span class="material-icons text-sm mr-1">code</span>
                              RESPONSE
                          </div>
                          <div class="bg-gray-900 text-white text-xs border border-gray-700 rounded">
                              <div class="max-h-80 overflow-auto" id="response-content-${catIndex}-${endpointIndex}"></div>
                          </div>
                      </div>
                  </div>
              </div>`;
      });
      
      html += `</div></div></div>`;
    });
    
    apiList.innerHTML = html;
    endpointCountSpan.textContent = totalEndpoints;
    
  } catch (error) {
    apiList.innerHTML = '<div class="text-red-500 text-center p-4 border border-red-500/30 rounded">❌ Failed to load API data. Please refresh.</div>';
    console.error('Error loading API data:', error);
  }
}

// Search functionality
document.addEventListener('DOMContentLoaded', function() {
  loadApis();
  
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase().trim();
      const apiItems = document.querySelectorAll('.api-item');
      const categories = document.querySelectorAll('.category-group');
      const noResults = document.getElementById('noResults');
      let visibleCount = 0;

      apiItems.forEach(item => {
        const path = (item.dataset.path || '').toLowerCase();
        const alias = (item.dataset.alias || '').toLowerCase();
        const description = (item.dataset.description || '').toLowerCase();
        const category = (item.dataset.category || '').toLowerCase();
        
        const matches = path.includes(searchTerm) || 
                       alias.includes(searchTerm) || 
                       description.includes(searchTerm) ||
                       category.includes(searchTerm);
        
        if (matches || searchTerm === '') {
          item.style.display = '';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      categories.forEach(category => {
        const visibleItems = category.querySelectorAll('.api-item[style=""]');
        category.style.display = visibleItems.length > 0 ? '' : 'none';
      });

      noResults.style.display = visibleCount === 0 && searchTerm !== '' ? 'block' : 'none';
    });
  }
});
</script>

</body>
</html>
