<style>
::-webkit-scrollbar{display:none}

:root{
  --bg:#1b1b1b;
  --panel:#2a2a2a;
  --border:#3f3f3f;
  --text:#e5e7eb;
  --input:#1e1e1e;
}
body.light{
  --bg:#e5e7eb;
  --panel:#f3f4f6;
  --border:#cbd5e1;
  --text:#111827;
  --input:#ffffff;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
}

.mc-panel{
  background:var(--panel);
  border:4px solid var(--border);
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.4),
    inset 4px 4px 0 rgba(255,255,255,.05);
}

.category-group,
.category-group > div,
.category-group button,
.api-item,
.api-item button,
#endpoint-content,
#endpoint-content > div{
  background:var(--panel) !important;
  border-color:var(--border) !important;
  color:var(--text) !important;
}
.category-group button:hover,
.api-item button:hover{
  background:rgba(0,0,0,.15) !important;
}

.mc-input{
  background:var(--input);
  border:3px solid var(--border);
  color:var(--text);
}

.mc-btn{
  background:#3a7d3a;
  border:3px solid #2b5d2b;
  box-shadow:
    inset -3px -3px 0 #1f3f1f,
    inset 3px 3px 0 #5fa75f;
  font-size:10px;
  padding:8px 14px;
  color:#fff;
}
.mc-btn:active{
  box-shadow:
    inset 3px 3px 0 #1f3f1f,
    inset -3px -3px 0 #5fa75f;
}

.mc-btn-clear{
  background:#555;
  border:3px solid #333;
  color:#fff;
  font-size:10px;
  padding:8px 14px;
}

.method-get{
  background:#2563eb;
  border:3px solid #1e40af;
  padding:3px 6px;
  font-size:10px;
  color:#fff;
}

.mc-response{
  background:#0b0b0b;
  border:3px solid #1f2937;
  color:#22c55e;
}

.bg-bottom{
  background-image:url("https://c.termai.cc/i199/f6HGr.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* ===== PERBAIKAN TAMPILAN ===== */
.bg-bottom {
  position: relative;
  isolation: isolate;
}
.bg-bottom::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 0;
}
body.light .bg-bottom::before {
  background: rgba(255, 255, 255, 0.75);
}
.bg-bottom > * {
  position: relative;
  z-index: 1;
}

body.light .bg-gray-800,
body.light .bg-gray-900,
body.light .border-gray-700,
body.light .border-gray-600 {
  background-color: #ffffff !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}
body.light .text-gray-400,
body.light .text-slate-400,
body.light .text-slate-300 {
  color: #374151 !important;
}
body.light .bg-gray-700 {
  background-color: #f3f4f6 !important;
  border-color: #d1d5db !important;
}
body.light .placeholder\:text-slate-500::placeholder {
  color: #9ca3af !important;
}
body.light .mc-panel {
  box-shadow: 
    inset -4px -4px 0 rgba(0,0,0,0.05),
    inset 4px 4px 0 rgba(255,255,255,0.8) !important;
}

.mc-input:focus {
  outline: none;
  border-color: #3b82f6 !important;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
}

[class*="bg-green-500/20"],
[class*="bg-yellow-500/20"],
[class*="bg-red-500/20"] {
  background: rgba(0,0,0,0.25) !important;
  border: 1px solid currentColor;
  font-weight: 700;
  padding: 0.25rem 0.625rem;
  border-radius: 0;
}
.text-green-400 { color: #86efac !important; border-color: #86efac80 !important; }
.text-yellow-400 { color: #fde047 !important; border-color: #fde04780 !important; }
.text-red-400 { color: #fca5a5 !important; border-color: #fca5a580 !important; }

.mc-btn,
.mc-btn-clear,
button.bg-indigo-600,
button.bg-gray-700 {
  font-family: 'Ubuntu Mono', monospace !important;
  font-size: 11px !important;
  padding: 8px 16px !important;
  border: 3px solid !important;
  box-shadow: 
    inset -3px -3px 0 rgba(0,0,0,0.3),
    inset 3px 3px 0 rgba(255,255,255,0.1) !important;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.08s ease;
}
.mc-btn:active,
button.bg-indigo-600:active,
button.bg-gray-700:active {
  box-shadow: 
    inset 3px 3px 0 rgba(0,0,0,0.3),
    inset -3px -3px 0 rgba(255,255,255,0.1) !important;
  transform: translateY(2px);
}
button.bg-indigo-600 {
  background: #2563eb !important;
  border-color: #1e40af !important;
}
button.bg-gray-700 {
  background: #4b5563 !important;
  border-color: #374151 !important;
}

.mc-response {
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: hidden;
  max-height: 350px;
  overflow-y: auto;
  background: #0b0b0b !important;
  border: 3px solid #1f2937 !important;
  color: #22c55e !important;
  font-size: 11px;
  line-height: 1.5;
}
body.light .mc-response {
  background: #f9fafb !important;
  border-color: #cbd5e1 !important;
  color: #0d9488 !important;
}

.loader {
  width: 24px;
  height: 24px;
  border: 3px solid #3b3b3b;
  border-top: 3px solid #22c55e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 1rem auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
body.light .loader {
  border-color: #ccc;
  border-top-color: #0d9488;
}

@media (max-width: 640px) {
  .max-w-2xl {
    padding-left: 1.25rem !important;
    padding-right: 1.25rem !important;
  }
  .mc-panel {
    padding: 1.25rem !important;
  }
  .flex.justify-between {
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .font-mc {
    font-size: 0.65rem !important;
  }
}

.fab {
  font-size: 1.4rem !important;
  color: var(--text) !important;
  opacity: 0.8;
  transition: opacity 0.2s;
}
.fab:hover {
  opacity: 1;
}

html {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
body::-webkit-scrollbar {
  display: none;
}

.opacity-60 {
  opacity: 0.75 !important;
}
.text-xs {
  line-height: 1.5 !important;
}
</style>
</head>

<body class="font-mono">

<div class="max-w-2xl mx-auto px-6 py-10 mc-panel">

<div class="flex justify-between items-center mb-6">
  <span class="font-mc text-xs">MANZXY API</span>
  <div class="flex gap-2">
    <button onclick="setTheme('dark')" class="mc-btn">DARK</button>
    <button onclick="setTheme('light')" class="mc-btn">LIGHT</button>
  </div>
</div>

<input id="searchInput"
 class="w-full mc-input text-xs mb-6 px-4 py-3"
 placeholder="Search API endpoints...">

<!-- API LIST -->
<div id="apiList" class="space-y-3"></div>

<footer class="mt-10 text-center text-xs opacity-60">
© 2025 Manzxy
</footer>

</div>

<!-- CONTRIBUTORS -->
<div class="max-w-2xl mx-auto px-6 pb-16 mc-panel bg-bottom">

<h2 class="font-mc text-xs text-center opacity-80 mb-6">
CONTRIBUTORS
</h2>

<div class="space-y-4">
  <div class="mc-panel flex items-center gap-4 p-4">
    <img src="https://avatars.githubusercontent.com/manzxy" class="w-14 h-14 border-2 border-gray-600" onerror="this.src='https://ui-avatars.com/api/?name=Manzxy&background=2a2a2a&color=fff&size=56'">
    <div class="flex-1">
      <div class="text-xs">Manzxy</div>
      <div class="text-[10px] opacity-70">Developer</div>
    </div>
    <a href="https://t.me/manzxyyx"><i class="fab fa-telegram"></i></a>
    <a href="https://github.com/manzxy"><i class="fab fa-github"></i></a>
  </div>
</div>

</div>

<script>
// THEME - HANYA SATU FUNGSI
function setTheme(mode){
  document.body.classList.toggle('light', mode === 'light')
  localStorage.setItem('theme', mode)
}
setTheme(localStorage.getItem('theme') || 'dark')

// TOGGLE CATEGORY
function toggleCategory(index) {
  const category = document.getElementById(`category-${index}`);
  const icon = document.getElementById(`category-icon-${index}`);
  if (category.classList.contains('hidden')) {
    category.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    category.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

// TOGGLE ENDPOINT
function toggleEndpoint(catIndex, endpointIndex) {
  const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
  const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
  if (endpoint.classList.contains('hidden')) {
    endpoint.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    endpoint.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

// EXECUTE REQUEST
async function executeRequest(event, catIndex, endpointIndex, method, path) {
  event.preventDefault();
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  
  const formData = new FormData(form);
  const params = new URLSearchParams();
  for (const [key, value] of formData.entries()) {
    if (value) params.append(key, value);
  }

  // BASE URL - ganti dengan domain API Anda
  const baseURL = 'https://api.manzxy.my.id';
  const fullPath = `${baseURL}${path}?${params.toString()}`;
  
  responseDiv.classList.remove('hidden');
  responseContent.innerHTML = '<div class="loader"></div>';

  try {
    const response = await fetch(fullPath);
    const contentType = response.headers.get("content-type");
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      responseContent.innerHTML = `<pre class="mc-response p-4">${JSON.stringify(data, null, 2)}</pre>`;
    } else if (contentType && contentType.startsWith("image/")) {
      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);
      responseContent.innerHTML = `<img src="${imageUrl}" class="max-w-full">`;
    } else {
      const text = await response.text();
      responseContent.innerHTML = `<pre class="mc-response p-4">${text}</pre>`;
    }
  } catch (error) {
    responseContent.innerHTML = `<pre class="mc-response p-4">Error: ${error.message}</pre>`;
  }
  clearButton.classList.remove('hidden');
}

// CLEAR RESPONSE
function clearResponse(catIndex, endpointIndex) {
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  responseContent.innerHTML = '';
  responseDiv.classList.add('hidden');
  clearButton.classList.add('hidden');
}

// LOAD APIS - PAKAI FILE SETTINGS.JSON ANDA!
async function loadApis() {
  const apiList = document.getElementById('apiList');
  
  try {
    // ===== INI YANG DIPERBAIKI =====
    // Coba beberapa kemungkinan path
    let response;
    try {
      // Path 1: relative ke root (paling umum)
      response = await fetch('./assets/settings.json');
    } catch {
      try {
        // Path 2: tanpa titik
        response = await fetch('assets/settings.json');
      } catch {
        // Path 3: dengan nama folder falcon-api
        response = await fetch('/falcon-api/assets/settings.json');
      }
    }
    
    const data = await response.json();
    
    let html = '';
    
    data.categories.forEach((category, catIndex) => {
      html += `
      <div class="category-group" data-category="${category.name}">
        <div class="mb-2">
          <div class="bg-gray-800 border border-gray-700">
            <button onclick="toggleCategory(${catIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-colors duration-150">
              <h2 class="font-bold flex items-center">
                <span class="material-icons text-lg mr-3 text-gray-400">folder</span>
                <span class="truncate max-w-xs text-sm">${category.name}</span>
                <span class="ml-2 text-xs text-gray-500">(${category.items.length})</span>
              </h2>
              <span class="material-icons transition-transform duration-150" id="category-icon-${catIndex}">expand_more</span>
            </button>
            
            <div id="category-${catIndex}" class="hidden">`;
      
      category.items.forEach((item, endpointIndex) => {
        const method = 'GET';
        const pathParts = item.path.split('?');
        const path = pathParts[0];

        const statusClasses = {
          'ready': 'bg-green-500/20 text-green-400',
          'update': 'bg-yellow-500/20 text-yellow-400',
          'error': 'bg-red-500/20 text-red-400'
        };
        const statusClass = statusClasses[item.status] || 'bg-gray-600';

        html += `
        <div class="border-t border-gray-700 api-item" 
             data-method="${method}"
             data-path="${path}"
             data-alias="${item.name}"
             data-description="${item.desc}"
             data-category="${category.name}">
          <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-colors duration-150">
            <div class="flex items-center min-w-0 flex-1">
              <span class="inline-block px-3 py-1 text-xs font-semibold text-white mr-3 flex-shrink-0 bg-gray-600">
                ${method}
              </span>
              <div class="flex flex-col min-w-0 flex-1">
                <span class="font-semibold truncate max-w-[90%] font-mono text-sm" title="${path}">${path}</span>
                <div class="flex items-center">
                  <span class="text-xs text-gray-400 truncate max-w-[90%]" title="${item.name}">${item.name}</span>
                  <span class="ml-2 px-2 py-0.5 text-xs rounded-full ${statusClass}">${item.status || 'ready'}</span>
                </div>
              </div>
            </div>
            <span class="material-icons transition-transform duration-150 flex-shrink-0" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
          </button>
          
          <div id="endpoint-${catIndex}-${endpointIndex}" class="hidden bg-gray-800 p-4 border-t border-gray-700">
            <div class="mb-3">
              <div class="text-gray-400 text-xs">${item.desc}</div>
            </div>`;
        
        if (item.status === 'ready') {
          html += `
            <div>
              <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                <span class="material-icons text-sm mr-1">play_arrow</span>
                TRY IT OUT
              </div>
              <div>
                <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}')">
                  <div class="mb-4 space-y-2">`;
          
          if (item.params) {
            Object.keys(item.params).forEach(paramName => {
              html += `<div>
                <label class="block text-xs font-medium text-slate-400 mb-2">${paramName}</label>
                <input type="text" name="${paramName}" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-indigo-500 bg-gray-700 placeholder:text-slate-500" placeholder="${item.params[paramName]}">
              </div>`;
            });
          }
          
          html += `
                  </div>
                  <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-semibold text-white px-6 py-2 text-xs font-medium transition-colors duration-150">
                    Execute
                  </button>
                  <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="hidden bg-gray-700 border border-gray-600 hover:border-gray-500 font-semibold text-slate-300 px-6 py-2 text-xs font-medium transition-colors duration-150 ml-2">
                    Clear
                  </button>
                </form>
              </div>
            </div>`;
        } else {
          html += `<div class="text-yellow-400 text-xs p-3 bg-yellow-500/20 border border-yellow-500/30">Endpoint ini tidak dapat diuji coba saat ini.</div>`;
        }

        html += `
            <div id="response-${catIndex}-${endpointIndex}" class="hidden mt-4">
              <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                <span class="material-icons text-sm mr-1">code</span>
                RESPONSE
              </div>
              <div class="bg-gray-900 text-white text-xs p-4 border border-gray-700">
                <div class="max-h-80 overflow-auto" id="response-content-${catIndex}-${endpointIndex}"></div>
              </div>
            </div>
          </div>
        </div>`;
      });
      
      html += `</div></div></div>`;
    });
    
    apiList.innerHTML = html;
    
  } catch (error) {
    console.error('Error loading API data:', error);
    apiList.innerHTML = `
      <div class="text-red-500 p-4 border border-red-500">
        <p class="font-bold">Gagal memuat data API!</p>
        <p class="text-xs mt-2">Error: ${error.message}</p>
        <p class="text-xs mt-2">Pastikan file <strong>assets/settings.json</strong> ada di folder yang benar.</p>
        <p class="text-xs">Struktur folder: /falcon-api/assets/settings.json</p>
      </div>
    `;
  }
}

// SEARCH FUNCTION
function initSearch() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      const apiItems = document.querySelectorAll('.api-item');
      const categories = document.querySelectorAll('.category-group');
      let visibleCount = 0;

      apiItems.forEach(item => {
        const path = item.dataset.path?.toLowerCase() || '';
        const alias = item.dataset.alias?.toLowerCase() || '';
        const description = item.dataset.description?.toLowerCase() || '';
        
        if (path.includes(searchTerm) || alias.includes(searchTerm) || description.includes(searchTerm)) {
          item.style.display = '';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      categories.forEach(category => {
        const visibleItems = Array.from(category.querySelectorAll('.api-item')).filter(el => el.style.display !== 'none');
        category.style.display = visibleItems.length > 0 ? '' : 'none';
      });
    });
  }
}

// INITIAL LOAD
document.addEventListener('DOMContentLoaded', function() {
  loadApis();
  initSearch();
});
</script>

</body>
  </html>
