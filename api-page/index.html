<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manzxy API</title>
<link rel="icon" href="/assets/icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Hide scrollbar */
::-webkit-scrollbar {
  display: none;
}

/* ===== THEME VAR ===== */
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --input: #0d1117;
  --accent: #2f81f7;
  --accent-hover: #3c8eff;
  --success: #3fb950;
  --warning: #d29922;
  --error: #f85149;
  --hover: #21262d;
  --button-primary: #238636;
  --button-primary-hover: #2ea043;
  --button-secondary: #21262d;
  --button-secondary-hover: #30363d;
  --code-bg: #0d1117;
}

body.light {
  --bg: #ffffff;
  --panel: #f6f8fa;
  --border: #d0d7de;
  --text: #1f2328;
  --text-secondary: #656d76;
  --text-muted: #6e7781;
  --input: #ffffff;
  --accent: #0969da;
  --accent-hover: #1a7f37;
  --success: #1a7f37;
  --warning: #9a6700;
  --error: #cf222e;
  --hover: #eaeef2;
  --button-primary: #1f883d;
  --button-primary-hover: #2c974b;
  --button-secondary: #eaeef2;
  --button-secondary-hover: #d0d7de;
  --code-bg: #f6f8fa;
}

/* ===== GLOBAL ===== */
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  font-size: 14px;
}

/* ===== CONTAINER ===== */
.container-custom {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* ===== PANEL ===== */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.header-title {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text);
}

.header-title span {
  color: var(--accent);
}

/* ===== THEME TOGGLE ===== */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 24px;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: var(--button-secondary);
  border: 1px solid var(--border);
  transition: .2s;
  border-radius: 24px;
}

.toggle-slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 2px;
  bottom: 2px;
  background-color: var(--text);
  transition: .2s;
  border-radius: 50%;
}

input:checked + .toggle-slider {
  background-color: var(--accent);
}

input:checked + .toggle-slider:before {
  transform: translateX(24px);
}

.toggle-icon {
  font-size: 0.875rem;
  color: var(--text-secondary);
}

/* ===== SEARCH ===== */
.search-container {
  margin-bottom: 1.5rem;
}

.search-input {
  width: 100%;
  padding: 0.625rem 0.75rem;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 0.875rem;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.1);
}

.search-input::placeholder {
  color: var(--text-muted);
}

/* ===== NOTIFICATIONS ===== */
.notifications-section {
  margin-bottom: 2rem;
}

.notifications-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.875rem;
}

.notifications-list {
  padding: 0.5rem;
  min-height: 60px;
}

.notification-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 0.75rem;
  border-radius: 4px;
  font-size: 0.875rem;
  border-bottom: 1px solid var(--border);
}

.notification-item:last-child {
  border-bottom: none;
}

.notification-item.unread {
  background: rgba(47, 129, 247, 0.1);
}

.notification-content {
  flex: 1;
}

.notification-title {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.25rem;
}

.notification-message {
  color: var(--text-secondary);
  font-size: 0.8125rem;
}

.notification-date {
  color: var(--text-muted);
  font-size: 0.75rem;
  margin-top: 0.25rem;
}

.notification-badge {
  padding: 0.25rem 0.5rem;
  background: var(--accent);
  color: white;
  font-size: 0.625rem;
  font-weight: 600;
  border-radius: 12px;
  white-space: nowrap;
}

.notification-error {
  padding: 1rem;
  text-align: center;
  color: var(--error);
}

/* ===== CATEGORY ===== */
.category-group {
  margin-bottom: 1rem;
}

.category-header {
  width: 100%;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 600;
}

.category-header:hover {
  background: var(--hover);
}

.category-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.category-count {
  color: var(--text-secondary);
  font-size: 0.75rem;
  margin-left: 0.5rem;
}

/* ===== ENDPOINT ===== */
.endpoint-item {
  border: 1px solid var(--border);
  border-top: none;
  background: var(--panel);
}

.endpoint-item:first-of-type {
  border-top: 1px solid var(--border);
}

.endpoint-header {
  width: 100%;
  padding: 1rem;
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.endpoint-header:hover {
  background: var(--hover);
}

.method-badge {
  display: inline-block;
  padding: 0.25rem 0.5rem;
  background: #1f6feb;
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: 4px;
  white-space: nowrap;
}

.endpoint-info {
  flex: 1;
  min-width: 0;
}

.endpoint-name {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.endpoint-status {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  background: rgba(63, 185, 80, 0.1);
  color: var(--success);
  font-size: 0.6875rem;
  font-weight: 500;
  border-radius: 12px;
}

.endpoint-path {
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
  font-size: 0.8125rem;
  color: var(--accent);
  text-decoration: none;
  display: inline-block;
  margin-bottom: 0.25rem;
  word-break: break-all;
}

.endpoint-path:hover {
  text-decoration: underline;
}

.endpoint-desc {
  color: var(--text-secondary);
  font-size: 0.8125rem;
  margin-top: 0.25rem;
}

/* ===== ENDPOINT DETAIL ===== */
.endpoint-detail {
  padding: 1.5rem;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

.detail-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.875rem;
  margin-bottom: 1rem;
}

/* ===== FORM ===== */
.form-group {
  margin-bottom: 1rem;
}

.form-label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.8125rem;
  font-weight: 500;
  margin-bottom: 0.25rem;
}

.form-input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 0.875rem;
}

.form-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.1);
}

/* ===== BUTTONS ===== */
.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 1rem 0;
}

.btn {
  padding: 0.5rem 1rem;
  font-size: 0.8125rem;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.1s ease;
}

.btn:active {
  transform: translateY(1px);
}

.btn-primary {
  background: var(--button-primary);
  color: white;
}

.btn-primary:hover {
  background: var(--button-primary-hover);
}

.btn-secondary {
  background: var(--button-secondary);
  border: 1px solid var(--border);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--button-secondary-hover);
}

/* ===== CURL COMMAND ===== */
.curl-container {
  margin: 1rem 0;
}

.curl-command {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 1rem;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
  font-size: 0.8125rem;
  color: #79c0ff;
  word-break: break-all;
}

.curl-text {
  flex: 1;
  white-space: pre-wrap;
}

.curl-url {
  color: var(--text-secondary);
  font-size: 0.75rem;
  margin-top: 0.25rem;
  word-break: break-all;
  padding: 0.25rem 0.5rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
}

/* ===== RESPONSE ===== */
.response-container {
  margin-top: 1.5rem;
}

.response-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.875rem;
  margin-bottom: 0.75rem;
}

.response-content {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  position: relative;
  min-height: 100px;
}

.response-pre {
  padding: 1rem;
  margin: 0;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 400px;
  overflow-y: auto;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
  font-size: 0.8125rem;
  color: #79c0ff;
}

.copy-btn {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  padding: 0.25rem 0.5rem;
  background: var(--button-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 0.6875rem;
  cursor: pointer;
}

.copy-btn:hover {
  background: var(--button-secondary-hover);
}

/* ===== LOADER ===== */
.loader {
  border: 2px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 0.8s linear infinite;
  margin: 1rem auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== NO RESULTS ===== */
.no-results {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8125rem;
}

/* ===== CONTRIBUTORS ===== */
.contributors-section {
  margin-top: 2rem;
}

.contributors-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 1rem;
}

.contributor-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.contributor-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--border);
}

.contributor-info {
  flex: 1;
}

.contributor-name {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.25rem;
}

.contributor-role {
  color: var(--text-secondary);
  font-size: 0.8125rem;
}

.contributor-links {
  display: flex;
  gap: 0.75rem;
}

.contributor-links a {
  color: var(--text-secondary);
  font-size: 1rem;
}
.contributor-links a:hover {
  color: var(--text);
}

/* ===== UTILITY ===== */
.hidden {
  display: none;
}

.material-icons {
  font-size: 1.25rem;
  color: var(--text-secondary);
}
</style>
</head>

<body>

<!-- ================= MAIN ================= -->
<div class="container-custom">

  <!-- HEADER with Toggle Switch -->
  <div class="header">
    <div class="header-title">MANZXY <span>API</span></div>
    <div class="theme-toggle">
      <span class="toggle-icon">🌙</span>
      <label class="toggle-switch">
        <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-icon">☀️</span>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search by path, name, or description...">
  </div>

  <!-- NOTIFICATIONS SECTION -->
  <div class="notifications-section panel">
    <div class="notifications-header">
      <span class="material-icons">notifications</span>
      <span>NOTIFICATIONS</span>
    </div>
    <div id="notificationsList" class="notifications-list">
      <div class="loader"></div>
    </div>
  </div>

  <!-- CATEGORIES LIST -->
  <div id="apiList"></div>

  <!-- NO RESULTS MESSAGE -->
  <div id="noResults" class="no-results hidden">
    <span class="material-icons" style="font-size: 3rem;">search_off</span>
    <p style="margin-top: 1rem;">No endpoints found matching your search</p>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2025 Manzxy • <span id="endpoint-count">0</span> endpoints available
  </div>

  <!-- CONTRIBUTORS -->
  <div class="contributors-section">
    <div class="contributors-title">CONTRIBUTORS</div>
    <div class="contributor-card">
      <img src="https://c.termai.cc/i151/YU4EKRg.jpg" class="contributor-avatar">
      <div class="contributor-info">
        <div class="contributor-name">Manzxy</div>
        <div class="contributor-role">Lead Developer</div>
      </div>
      <div class="contributor-links">
        <a href="https://t.me/manzxyyx" target="_blank"><i class="fab fa-telegram"></i></a>
        <a href="https://github.com/manzxy" target="_blank"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>

</div>

<script>
// Theme toggle
function toggleTheme() {
  const isChecked = document.getElementById('themeToggle').checked;
  if (isChecked) {
    document.body.classList.add('light');
    localStorage.setItem('theme', 'light');
  } else {
    document.body.classList.remove('light');
    localStorage.setItem('theme', 'dark');
  }
}

// Initialize theme
(function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (savedTheme === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeToggle').checked = true;
  }
})();

// Copy to clipboard
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert('✅ Copied to clipboard!');
  } catch (err) {
    alert('❌ Failed to copy');
  }
}

// Generate curl command with full URL
function generateCurlCommand(method, path, params, baseUrl = 'https://manzxy.my.id') {
  let fullUrl = baseUrl + path;
  if (params && Object.keys(params).length > 0) {
    const paramString = new URLSearchParams(params).toString();
    fullUrl += '?' + paramString;
  }
  
  return {
    command: `curl -X ${method} "${fullUrl}"`,
    url: fullUrl
  };
}

// Format date
function formatDate(dateString) {
  const date = new Date(dateString);
  return date.toLocaleDateString('id-ID', { 
    year: 'numeric', 
    month: 'short', 
    day: 'numeric' 
  });
}

// Load notifications from /api-page/notifications.json
async function loadNotifications() {
  const notificationsList = document.getElementById('notificationsList');
  
  try {
    const response = await fetch('/api-page/notifications.json');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const notifications = await response.json();
    
    if (!notifications || notifications.length === 0) {
      notificationsList.innerHTML = '<div class="notification-item">Tidak ada notifikasi</div>';
      return;
    }
    
    // Sort by date descending (newest first)
    notifications.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    let html = '';
    notifications.forEach(notif => {
      const isUnread = !notif.read;
      html += `
        <div class="notification-item ${isUnread ? 'unread' : ''}">
          <div class="notification-content">
            <div class="notification-title">${notif.title}</div>
            <div class="notification-message">${notif.message}</div>
            <div class="notification-date">${formatDate(notif.date)}</div>
          </div>
          ${isUnread ? '<span class="notification-badge">Baru</span>' : ''}
        </div>
      `;
    });
    
    notificationsList.innerHTML = html;
    
  } catch (error) {
    console.error('Error loading notifications:', error);
    notificationsList.innerHTML = `
      <div class="notification-error">
        <span class="material-icons" style="font-size: 2rem; color: var(--error);">error</span>
        <p>❌ Gagal memuat notifikasi</p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem;">${error.message}</p>
      </div>
    `;
  }
}

// Category toggle
function toggleCategory(index) {
  const category = document.getElementById(`category-${index}`);
  const icon = document.getElementById(`category-icon-${index}`);
  if (category.classList.contains('hidden')) {
    category.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    category.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

// Endpoint toggle
function toggleEndpoint(catIndex, endpointIndex) {
  const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
  const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
  if (endpoint.classList.contains('hidden')) {
    endpoint.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    endpoint.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

// Show curl command
function showCurl(catIndex, endpointIndex, method, path) {
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const formData = new FormData(form);
  const params = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) params[key] = value;
  }
  
  const { command, url } = generateCurlCommand(method, path, params);
  
  let curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  if (!curlDiv) {
    curlDiv = document.createElement('div');
    curlDiv.id = `curl-${catIndex}-${endpointIndex}`;
    curlDiv.className = 'curl-container';
    
    curlDiv.innerHTML = `
      <div class="curl-command">
        <span class="curl-text">${command}</span>
        <button class="copy-btn" onclick='copyToClipboard(\`${command}\`)'>📋</button>
      </div>
      <div class="curl-url">${url}</div>
    `;
    
    const form_element = document.getElementById(`form-${catIndex}-${endpointIndex}`);
    form_element.parentNode.insertBefore(curlDiv, form_element.nextSibling);
  } else {
    curlDiv.innerHTML = `
      <div class="curl-command">
        <span class="curl-text">${command}</span>
        <button class="copy-btn" onclick='copyToClipboard(\`${command}\`)'>📋</button>
      </div>
      <div class="curl-url">${url}</div>
    `;
  }
}

// Execute request
async function executeRequest(event, catIndex, endpointIndex, method, path) {
  event.preventDefault();
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  
  const formData = new FormData(form);
  const params = new URLSearchParams();
  const paramsObj = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) {
      params.append(key, value);
      paramsObj[key] = value;
    }
  }

  const baseUrl = 'https://api.manzxy.my.id';
  const fullPath = `${baseUrl}${path}?${params.toString()}`;
  
  // Show curl command
  showCurl(catIndex, endpointIndex, method, path, paramsObj);
  
  responseDiv.classList.remove('hidden');
  responseContent.innerHTML = '<div class="loader"></div>';

  try {
    const response = await fetch(fullPath);
    const contentType = response.headers.get("content-type");
    
    let resultHtml = '';
    let resultText = '';
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status} - ${response.statusText}`);
    }
    
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      resultText = JSON.stringify(data, null, 2);
      resultHtml = `<pre class="response-pre">${resultText}</pre>`;
    } else if (contentType && contentType.startsWith("image/")) {
      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);
      resultHtml = `<img src="${imageUrl}" style="max-width: 100%; height: auto; display: block;">`;
      resultText = '[IMAGE DATA]';
    } else {
      const text = await response.text();
      resultText = text;
      resultHtml = `<pre class="response-pre">${text}</pre>`;
    }
    
    responseContent.innerHTML = `
      <div style="position: relative;">
        <button class="copy-btn" onclick='copyToClipboard(${JSON.stringify(resultText)})'>📋 Copy</button>
        ${resultHtml}
      </div>
    `;
    
  } catch (error) {
    responseContent.innerHTML = `
      <pre class="response-pre" style="color: var(--error);">
Error: ${error.message}

URL: ${fullPath}

Possible causes:
• CORS policy (if running locally)
• API server down
• Network issue
• Invalid endpoint
      </pre>
    `;
  }
  clearButton.classList.remove('hidden');
}

// Clear response
function clearResponse(catIndex, endpointIndex) {
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  const curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  
  responseContent.innerHTML = '';
  responseDiv.classList.add('hidden');
  clearButton.classList.add('hidden');
  
  if (curlDiv) {
    curlDiv.remove();
  }
}

// Load APIs from /assets/settings.json
async function loadApis() {
  const apiList = document.getElementById('apiList');
  const endpointCountSpan = document.getElementById('endpoint-count');
  
  try {
    const response = await fetch('/assets/settings.json');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    
    let html = '';
    let totalEndpoints = 0;
    
    data.categories.forEach((category, catIndex) => {
      totalEndpoints += category.items.length;
      
      html += `
        <div class="category-group">
          <button onclick="toggleCategory(${catIndex})" class="category-header">
            <div class="category-title">
              <span class="material-icons">folder</span>
              <span>${category.name}</span>
              <span class="category-count">(${category.items.length})</span>
            </div>
            <span class="material-icons" id="category-icon-${catIndex}">expand_more</span>
          </button>
          <div id="category-${catIndex}" class="hidden">`;
      
      category.items.forEach((item, endpointIndex) => {
        const method = 'GET';
        const pathParts = item.path.split('?');
        const path = pathParts[0];

        html += `
          <div class="endpoint-item">
            <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="endpoint-header">
              <span class="method-badge">${method}</span>
              <div class="endpoint-info">
                <div class="endpoint-name">
                  ${item.name}
                  <span class="endpoint-status">${item.status || 'ready'}</span>
                </div>
                <span class="endpoint-path">${path}</span>
                <div class="endpoint-desc">${item.desc}</div>
              </div>
              <span class="material-icons" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
            </button>
            
            <div id="endpoint-${catIndex}-${endpointIndex}" class="endpoint-detail hidden">
              <div class="detail-title">
                <span class="material-icons">play_arrow</span>
                <span>TRY IT OUT</span>
              </div>
              <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}')">`;
        
        if (item.params) {
          Object.keys(item.params).forEach(paramName => {
            html += `
                <div class="form-group">
                  <label class="form-label">${paramName}</label>
                  <input type="text" name="${paramName}" class="form-input" placeholder="${item.params[paramName]}">
                </div>`;
          });
        }
        
        html += `
                <div class="btn-group">
                  <button type="submit" class="btn btn-primary">Execute</button>
                  <button type="button" class="btn btn-secondary" onclick="showCurl(${catIndex}, ${endpointIndex}, '${method}', '${path}')">CURL</button>
                  <button type="button" id="clear-${catIndex}-${endpointIndex}" class="btn btn-secondary hidden" onclick="clearResponse(${catIndex}, ${endpointIndex})">Clear</button>
                </div>
              </form>

              <div id="response-${catIndex}-${endpointIndex}" class="response-container hidden">
                <div class="response-header">
                  <span class="material-icons">code</span>
                  <span>RESPONSE</span>
                </div>
                <div class="response-content">
                  <div id="response-content-${catIndex}-${endpointIndex}"></div>
                </div>
              </div>
            </div>
          </div>`;
      });
      
      html += `</div></div>`;
    });
    
    apiList.innerHTML = html;
    if (endpointCountSpan) endpointCountSpan.textContent = totalEndpoints;
    
  } catch (error) {
    console.error('Error loading API data:', error);
    apiList.innerHTML = `
      <div class="panel" style="padding: 2rem; text-align: center; color: var(--error);">
        <span class="material-icons" style="font-size: 3rem;">error</span>
        <p style="margin-top: 1rem;">❌ Failed to load API data</p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem;">${error.message}</p>
        <p style="font-size: 0.75rem; margin-top: 1rem;">Pastikan file /assets/settings.json tersedia</p>
      </div>
    `;
  }
}

// Search functionality
document.addEventListener('DOMContentLoaded', () => {
  loadApis();
  loadNotifications();
  
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase().trim();
      const apiItems = document.querySelectorAll('.endpoint-item');
      const categories = document.querySelectorAll('.category-group');
      const noResults = document.getElementById('noResults');
      let visibleCount = 0;

      apiItems.forEach(item => {
        const name = item.querySelector('.endpoint-name')?.textContent.toLowerCase() || '';
        const path = item.querySelector('.endpoint-path')?.textContent.toLowerCase() || '';
        const desc = item.querySelector('.endpoint-desc')?.textContent.toLowerCase() || '';
        
        const matches = name.includes(searchTerm) || path.includes(searchTerm) || desc.includes(searchTerm);
        
        if (matches || searchTerm === '') {
          item.style.display = '';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      categories.forEach(category => {
        const visibleItems = category.querySelectorAll('.endpoint-item[style=""]');
        category.style.display = visibleItems.length > 0 ? '' : 'none';
      });

      if (noResults) {
        noResults.style.display = visibleCount === 0 && searchTerm !== '' ? 'block' : 'none';
      }
    });
  }
});
</script>
