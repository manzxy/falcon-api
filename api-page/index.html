<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manzxy APIs</title>
<link rel="icon" href="/assets/icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu+Mono&display=swap" rel="stylesheet">

<style>
/* Hide scrollbar */
::-webkit-scrollbar{display:none}

/* ===== THEME VAR ===== */
:root{
  --bg:#1a1a1a;
  --panel:#2d2d2d;
  --border:#404040;
  --text:#ffffff;
  --text-secondary:#a0a0a0;
  --input:#333333;
  --accent:#3b82f6;
  --success:#10b981;
  --warning:#f59e0b;
  --error:#ef4444;
  --hover:#404040;
}

/* Light theme colors */
body.light{
  --bg:#f0f0f0;
  --panel:#ffffff;
  --border:#d1d5db;
  --text:#1f2937;
  --text-secondary:#6b7280;
  --input:#f3f4f6;
  --accent:#2563eb;
  --success:#059669;
  --warning:#d97706;
  --error:#dc2626;
  --hover:#e5e7eb;
}

/* ===== GLOBAL ===== */
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Ubuntu Mono', monospace;
}

/* ===== CONTAINER ===== */
.container-custom {
  max-width: 42rem;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* ===== PANEL ===== */
.mc-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

/* ===== HEADER ===== */
.header-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.75rem;
  color: var(--text);
}

/* ===== SEARCH INPUT ===== */
.search-input {
  width: 100%;
  background: var(--input);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.75rem;
  padding: 0.75rem 1rem;
  margin-bottom: 1.5rem;
}
.search-input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ===== CATEGORY ===== */
.category-group {
  margin-bottom: 0.5rem;
}

.category-header {
  width: 100%;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
}
.category-header:hover {
  background: var(--hover);
}

.category-title {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-weight: bold;
  font-size: 0.875rem;
}

.category-count {
  color: var(--text-secondary);
  font-size: 0.75rem;
  margin-left: 0.5rem;
}

/* ===== ENDPOINT ===== */
.endpoint-item {
  border-top: 1px solid var(--border);
}

.endpoint-header {
  width: 100%;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}
.endpoint-header:hover {
  background: var(--hover);
}

.method-badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  background: #2563eb;
  border: 1px solid #1e40af;
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  margin-right: 0.75rem;
}

.endpoint-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.endpoint-path {
  font-weight: 600;
  font-size: 0.875rem;
  font-family: 'Ubuntu Mono', monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.endpoint-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.25rem;
}

.endpoint-name {
  color: var(--text-secondary);
  font-size: 0.75rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.status-badge {
  padding: 0.125rem 0.5rem;
  font-size: 0.625rem;
  border-radius: 9999px;
}
.status-ready { background: rgba(16, 185, 129, 0.2); color: #10b981; }
.status-update { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
.status-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

/* ===== ENDPOINT DETAIL ===== */
.endpoint-detail {
  background: var(--panel);
  padding: 1rem;
  border-top: 1px solid var(--border);
}

.endpoint-desc {
  color: var(--text-secondary);
  font-size: 0.75rem;
  line-height: 1.5;
  margin-bottom: 0.75rem;
}

/* ===== FORM ===== */
.form-label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 500;
  margin-bottom: 0.25rem;
}

.form-input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  background: var(--input);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.875rem;
}
.form-input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ===== BUTTONS ===== */
.btn {
  padding: 0.5rem 1rem;
  font-size: 0.75rem;
  font-weight: 500;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.1s ease;
}
.btn:active {
  transform: translateY(1px);
}

.btn-execute {
  background: #2563eb;
  border-color: #1e40af;
  color: white;
}
.btn-execute:hover {
  background: #1d4ed8;
}

.btn-curl {
  background: #7e22ce;
  border-color: #6b21a5;
  color: white;
}
.btn-curl:hover {
  background: #6b21a5;
}

.btn-copy {
  background: #4b5563;
  border-color: #374151;
  color: white;
}
.btn-copy:hover {
  background: #374151;
}

.btn-clear {
  background: #4b5563;
  border-color: #374151;
  color: white;
}
.btn-clear:hover {
  background: #374151;
}

/* ===== THEME TOGGLE ===== */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 24px;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #2d2d2d;
  border: 1px solid #404040;
  transition: .2s;
  border-radius: 24px;
}

.toggle-slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 2px;
  background-color: white;
  transition: .2s;
  border-radius: 50%;
}

input:checked + .toggle-slider {
  background-color: #3b82f6;
}

input:checked + .toggle-slider:before {
  transform: translateX(24px);
}

.toggle-icon {
  font-size: 0.875rem;
}

/* ===== RESPONSE ===== */
.response-container {
  margin-top: 1rem;
}

.response-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-secondary);
  font-weight: bold;
  font-size: 0.75rem;
  margin-bottom: 0.5rem;
}

.response-content {
  background: #1a1a1a;
  border: 1px solid #2d2d2d;
  color: #10b981;
  font-size: 0.75rem;
  position: relative;
}

.response-pre {
  padding: 1rem;
  margin: 0;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 300px;
  overflow-y: auto;
  font-family: 'Ubuntu Mono', monospace;
}

/* ===== CURL COMMAND ===== */
.curl-command {
  background: #1a1a1a;
  border: 1px solid #2d2d2d;
  padding: 0.5rem 0.75rem;
  margin-top: 0.5rem;
  font-family: 'Ubuntu Mono', monospace;
  font-size: 0.6875rem;
  color: #10b981;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}

.curl-text {
  flex: 1;
  word-break: break-all;
}

/* ===== TOAST NOTIFICATION ===== */
.toast {
  position: fixed;
  bottom: -100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  color: var(--text);
  font-size: 0.75rem;
  z-index: 9999;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  transition: bottom 0.3s ease;
  border-radius: 0;
  white-space: nowrap;
}

.toast.show {
  bottom: 20px;
}

.toast.success {
  border-left: 4px solid #10b981;
}
.toast.error {
  border-left: 4px solid #ef4444;
}
.toast.info {
  border-left: 4px solid #3b82f6;
}

/* ===== LOADER ===== */
.loader {
  border: 2px solid #2d2d2d;
  border-top: 2px solid #3b82f6;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 0.8s linear infinite;
  margin: 10px auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== NO RESULTS ===== */
.no-results {
  text-align: center;
  padding: 2.5rem 1.25rem;
  color: var(--text-secondary);
  font-size: 0.75rem;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 2.5rem;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

/* ===== CONTRIBUTORS ===== */
.contributors-section {
  margin-top: 2rem;
}

.contributors-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.75rem;
  text-align: center;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}

.contributor-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: var(--panel);
  border: 1px solid var(--border);
}

.contributor-avatar {
  width: 3.5rem;
  height: 3.5rem;
  border: 1px solid var(--border);
}

.contributor-name {
  font-size: 0.75rem;
  font-weight: bold;
}

.contributor-role {
  font-size: 0.625rem;
  color: var(--text-secondary);
}

.contributor-links {
  display: flex;
  gap: 0.75rem;
  margin-left: auto;
}

.contributor-links a {
  color: var(--text-secondary);
  font-size: 1rem;
}
.contributor-links a:hover {
  color: var(--text);
}
</style>
</head>

<body>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<!-- ================= MAIN ================= -->
<div class="container-custom mc-panel">

<!-- HEADER with Toggle Switch -->
<div class="flex justify-between items-center mb-6">
  <span class="header-title">⚡ MANZXY API</span>
  <div class="theme-toggle">
    <span class="toggle-icon">🌙</span>
    <label class="toggle-switch">
      <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
      <span class="toggle-slider"></span>
    </label>
    <span class="toggle-icon">☀️</span>
  </div>
</div>

<!-- SEARCH -->
<input type="text" id="searchInput" class="search-input" placeholder="Search by path, name, or description...">

<!-- API LIST -->
<div id="apiList" class="space-y-1"></div>

<!-- NO RESULTS MESSAGE -->
<div id="noResults" class="no-results hidden">
  <span class="material-icons text-4xl mb-2">search_off</span>
  <p>No endpoints found matching your search</p>
</div>

<!-- FOOTER -->
<div class="footer">
© 2025 Manzxy • <span id="endpoint-count">0</span> endpoints available
</div>

</div>

<!-- ================= CONTRIBUTORS ================= -->
<div class="container-custom mc-panel contributors-section">

<div class="contributors-title">👥 CONTRIBUTORS</div>

<div class="contributor-card">
  <img src="https://c.termai.cc/i151/YU4EKRg.jpg" class="contributor-avatar">
  <div>
    <div class="contributor-name">Manzxy</div>
    <div class="contributor-role">Lead Developer</div>
  </div>
  <div class="contributor-links">
    <a href="https://t.me/manzxyyx" target="_blank"><i class="fab fa-telegram"></i></a>
    <a href="https://github.com/manzxy" target="_blank"><i class="fab fa-github"></i></a>
  </div>
</div>

</div>

<script>
// Toast notification with slide animation
function showToast(message, type = 'info', duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type}`;
  
  // Trigger reflow
  void toast.offsetWidth;
  
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

// Theme toggle
function toggleTheme() {
  const isChecked = document.getElementById('themeToggle').checked;
  if (isChecked) {
    document.body.classList.add('light');
    localStorage.setItem('theme', 'light');
    showToast('🌞 Light mode activated', 'info');
  } else {
    document.body.classList.remove('light');
    localStorage.setItem('theme', 'dark');
    showToast('🌙 Dark mode activated', 'info');
  }
}

// Initialize theme
(function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (savedTheme === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeToggle').checked = true;
  }
})();

// Copy to clipboard
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('✅ Copied to clipboard!', 'success');
  } catch (err) {
    showToast('❌ Failed to copy', 'error');
  }
}

// Generate curl command
function generateCurlCommand(method, path, params) {
  let curlCmd = `curl -X ${method} `;
  if (params && Object.keys(params).length > 0) {
    const paramString = new URLSearchParams(params).toString();
    curlCmd += `"${path}?${paramString}"`;
  } else {
    curlCmd += `"${path}"`;
  }
  return curlCmd;
}

function toggleCategory(index) {
  const category = document.getElementById(`category-${index}`);
  const icon = document.getElementById(`category-icon-${index}`);
  if (category.classList.contains('hidden')) {
    category.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    category.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

function toggleEndpoint(catIndex, endpointIndex) {
  const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
  const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
  if (endpoint.classList.contains('hidden')) {
    endpoint.classList.remove('hidden');
    icon.textContent = 'expand_less';
  } else {
    endpoint.classList.add('hidden');
    icon.textContent = 'expand_more';
  }
}

function showCurl(catIndex, endpointIndex, method, path) {
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const formData = new FormData(form);
  const params = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) params[key] = value;
  }
  
  const curlCmd = generateCurlCommand(method, path, params);
  
  let curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  if (!curlDiv) {
    curlDiv = document.createElement('div');
    curlDiv.id = `curl-${catIndex}-${endpointIndex}`;
    curlDiv.className = 'curl-command';
    
    const curlText = document.createElement('span');
    curlText.className = 'curl-text';
    curlText.textContent = curlCmd;
    
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-copy text-[8px] px-2 py-1';
    copyBtn.innerHTML = '📋';
    copyBtn.onclick = () => copyToClipboard(curlCmd);
    
    curlDiv.appendChild(curlText);
    curlDiv.appendChild(copyBtn);
    
    const form_element = document.getElementById(`form-${catIndex}-${endpointIndex}`);
    form_element.parentNode.insertBefore(curlDiv, form_element.nextSibling);
  } else {
    curlDiv.querySelector('.curl-text').textContent = curlCmd;
    curlDiv.querySelector('button').onclick = () => copyToClipboard(curlCmd);
  }
}

async function executeRequest(event, catIndex, endpointIndex, method, path) {
  event.preventDefault();
  const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  
  const formData = new FormData(form);
  const params = new URLSearchParams();
  const paramsObj = {};
  
  for (const [key, value] of formData.entries()) {
    if (value) {
      params.append(key, value);
      paramsObj[key] = value;
    }
  }

  const fullPath = `${path}?${params.toString()}`;
  
  showCurl(catIndex, endpointIndex, method, path, paramsObj);
  
  responseDiv.classList.remove('hidden');
  responseContent.innerHTML = '<div class="loader"></div>';
  showToast('🚀 Executing request...', 'info');

  try {
    const response = await fetch(fullPath);
    const contentType = response.headers.get("content-type");
    
    let resultHtml = '';
    let resultText = '';
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      resultText = JSON.stringify(data, null, 2);
      resultHtml = `<pre class="response-pre">${resultText}</pre>`;
      showToast('✅ Request successful', 'success');
    } else if (contentType && contentType.startsWith("image/")) {
      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);
      resultHtml = `<img src="${imageUrl}" class="max-w-full h-auto">`;
      resultText = '[IMAGE DATA]';
      showToast('✅ Image loaded', 'success');
    } else {
      const text = await response.text();
      resultText = text;
      resultHtml = `<pre class="response-pre">${text}</pre>`;
      showToast('✅ Request successful', 'success');
    }
    
    responseContent.innerHTML = `
      <div style="position: relative;">
        <div style="position: absolute; top: 0.5rem; right: 0.5rem;">
          <button onclick='copyToClipboard(${JSON.stringify(resultText)})' class="btn btn-copy text-[8px] px-2 py-1">
            📋
          </button>
        </div>
        ${resultHtml}
      </div>
    `;
    
  } catch (error) {
    responseContent.innerHTML = `<pre class="response-pre" style="color: #ef4444;">Error: ${error.message}</pre>`;
    showToast('❌ Request failed', 'error');
  }
  clearButton.classList.remove('hidden');
}

function clearResponse(catIndex, endpointIndex) {
  const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
  const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
  const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
  const curlDiv = document.getElementById(`curl-${catIndex}-${endpointIndex}`);
  
  responseContent.innerHTML = '';
  responseDiv.classList.add('hidden');
  clearButton.classList.add('hidden');
  
  if (curlDiv) {
    curlDiv.remove();
  }
  
  showToast('🧹 Response cleared', 'info');
}

async function loadApis() {
  const apiList = document.getElementById('apiList');
  const endpointCountSpan = document.getElementById('endpoint-count');
  
  try {
    const response = await fetch('/assets/settings.json');
    const data = await response.json();
    
    let html = '';
    let totalEndpoints = 0;
    
    data.categories.forEach((category, catIndex) => {
      totalEndpoints += category.items.length;
      
      html += `
      <div class="category-group">
        <button onclick="toggleCategory(${catIndex})" class="category-header">
          <div class="category-title">
            <span class="material-icons">folder</span>
            <span>${category.name}</span>
            <span class="category-count">(${category.items.length})</span>
          </div>
          <span class="material-icons" id="category-icon-${catIndex}">expand_more</span>
        </button>
        <div id="category-${catIndex}" class="hidden">`;
      
      category.items.forEach((item, endpointIndex) => {
        const method = 'GET';
        const pathParts = item.path.split('?');
        const path = pathParts[0];
        
        let statusClass = '';
        if (item.status === 'ready') statusClass = 'status-ready';
        else if (item.status === 'update') statusClass = 'status-update';
        else if (item.status === 'error') statusClass = 'status-error';

        html += `
          <div class="endpoint-item">
            <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="endpoint-header">
              <div style="display: flex; align-items: center; min-width: 0; flex: 1;">
                <span class="method-badge">${method}</span>
                <div class="endpoint-info">
                  <span class="endpoint-path" title="${path}">${path}</span>
                  <div class="endpoint-meta">
                    <span class="endpoint-name" title="${item.name}">${item.name}</span>
                    <span class="status-badge ${statusClass}">${item.status || 'ready'}</span>
                  </div>
                </div>
              </div>
              <span class="material-icons" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
            </button>
            
            <div id="endpoint-${catIndex}-${endpointIndex}" class="endpoint-detail hidden">
              <div class="endpoint-desc">${item.desc}</div>`;
        
        if (item.status === 'ready') {
          html += `
            <div>
              <div style="display: flex; align-items: center; gap: 0.25rem; color: var(--text-secondary); font-weight: bold; font-size: 0.75rem; margin-bottom: 0.5rem;">
                <span class="material-icons" style="font-size: 1rem;">play_arrow</span>
                <span>TRY IT OUT</span>
              </div>
              <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}')">
                <div style="margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">`;
          
          if (item.params) {
            Object.keys(item.params).forEach(paramName => {
              html += `
                <div>
                  <label class="form-label">${paramName}</label>
                  <input type="text" name="${paramName}" class="form-input" placeholder="${item.params[paramName]}">
                </div>`;
            });
          }
          
          html += `
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                  <button type="submit" class="btn btn-execute">Execute</button>
                  <button type="button" onclick="showCurl(${catIndex}, ${endpointIndex}, '${method}', '${path}')" class="btn btn-curl">CURL</button>
                  <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="btn btn-clear hidden">Clear</button>
                </div>
              </form>
            </div>`;
        } else {
          html += `<div style="color: #f59e0b; font-size: 0.75rem; padding: 0.75rem; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2);">⚠️ Endpoint ini tidak dapat diuji coba saat ini.</div>`;
        }

        html += `
              <div id="response-${catIndex}-${endpointIndex}" class="response-container hidden">
                <div class="response-header">
                  <span class="material-icons" style="font-size: 1rem;">code</span>
                  <span>RESPONSE</span>
                </div>
                <div class="response-content">
                  <div id="response-content-${catIndex}-${endpointIndex}" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
              </div>
            </div>
          </div>`;
      });
      
      html += `</div></div>`;
    });
    
    apiList.innerHTML = html;
    if (endpointCountSpan) endpointCountSpan.textContent = totalEndpoints;
    showToast(`📚 Loaded ${totalEndpoints} endpoints`, 'info');
    
  } catch (error) {
    apiList.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 1rem; border: 1px solid rgba(239, 68, 68, 0.3);">❌ Failed to load API data. Please refresh.</div>';
    showToast('❌ Failed to load API data', 'error');
    console.error('Error loading API data:', error);
  }
}

// Search functionality
document.addEventListener('DOMContentLoaded', () => {
  loadApis();
  
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase().trim();
      const apiItems = document.querySelectorAll('.endpoint-item');
      const categories = document.querySelectorAll('.category-group');
      const noResults = document.getElementById('noResults');
      let visibleCount = 0;

      apiItems.forEach(item => {
        const path = (item.querySelector('.endpoint-path')?.textContent || '').toLowerCase();
        const name = (item.querySelector('.endpoint-name')?.textContent || '').toLowerCase();
        
        const matches = path.includes(searchTerm) || name.includes(searchTerm);
        
        if (matches || searchTerm === '') {
          item.style.display = '';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      categories.forEach(category => {
        const visibleItems = category.querySelectorAll('.endpoint-item[style=""]');
        category.style.display = visibleItems.length > 0 ? '' : 'none';
      });

      if (noResults) {
        noResults.style.display = visibleCount === 0 && searchTerm !== '' ? 'block' : 'none';
      }
      
      if (searchTerm !== '') {
        showToast(`🔍 Found ${visibleCount} results`, 'info');
      }
    });
  }
});
</script>
