<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manzxy TikTok Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(145deg, #0b0b0b 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #f72585, #b5179e, #7209b7, #560bad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .badge {
            background: linear-gradient(45deg, #f72585, #b5179e);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group input {
            flex: 1;
            padding: 16px 22px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            outline: none;
            border-radius: 60px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group button {
            padding: 12px 32px;
            background: linear-gradient(45deg, #f72585, #b5179e);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-group button:hover {
            transform: scale(1.02);
            background: linear-gradient(45deg, #ff4d9e, #c925b0);
        }

        .example-links {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .example-links span {
            cursor: pointer;
            color: #f72585;
            text-decoration: underline;
            margin: 0 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f72585;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            text-align: center;
            padding: 30px;
            background: rgba(220, 20, 60, 0.1);
            border-radius: 20px;
            color: #ff6b6b;
            margin-top: 20px;
        }

        .error.active {
            display: block;
        }

        .result {
            display: none;
            margin-top: 30px;
        }

        .result.active {
            display: block;
        }

        .video-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f72585, #560bad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
        }

        .username {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .duration {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-item strong {
            color: #f72585;
            margin-right: 5px;
        }

        .section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            flex: 1 1 auto;
            min-width: 120px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #f72585;
            transform: translateY(-2px);
        }

        .btn-audio {
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .btn-audio:hover {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .image-item {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .footer a {
            color: #f72585;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MANZXY TIKTOK</h1>
        <div class="subtitle">Download Video & Audio</div>
        
        <div class="badge">🔍 Menggunakan Teknologi Scraping</div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Masukkan URL TikTok..." value="https://vt.tiktok.com/ZSa4J7JoB/">
            <button onclick="downloadVideo()">Download</button>
        </div>

        <div class="example-links">
            📌 Contoh: 
            <span onclick="document.getElementById('urlInput').value='https://vt.tiktok.com/ZSa4J7JoB/'">Video 1</span>
            <span onclick="document.getElementById('urlInput').value='https://vt.tiktok.com/ZSa4J7JoC/'">Video 2</span>
            <span onclick="document.getElementById('urlInput').value='https://vt.tiktok.com/ZSa4J7JoD/'">Slide</span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: rgba(255,255,255,0.6);">Memproses melalui SaveTT.cc...</p>
        </div>

        <div class="error" id="error">
            <p>⚠️ Gagal mengambil data. Periksa URL atau coba lagi.</p>
        </div>

        <div class="result" id="result"></div>

        <div class="footer">
            © 2026 Manzxy • Scraped from <a href="https://savett.cc" target="_blank">SaveTT.cc</a>
        </div>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                alert('Masukkan URL TikTok');
                return;
            }

            if (!url.includes('tiktok.com')) {
                alert('URL tidak valid. Harus dari tiktok.com');
                return;
            }

            // Tampilkan loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').classList.remove('active');

            try {
                // Panggil API backend kita sendiri
                const response = await fetch(`/api/tiktok?url=${encodeURIComponent(url)}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error);
                }

                renderResult(result.data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').classList.remove('active');
                document.getElementById('error').classList.add('active');
            }
        }

        function renderResult(data) {
            const container = document.getElementById('result');
            
            // Format angka (K, M)
            const formatNumber = (num) => {
                if (!num) return num;
                const n = parseInt(num);
                if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
                if (n >= 1000) return (n/1000).toFixed(1) + 'K';
                return n;
            };

            // Buat statistik
            let statsHtml = '';
            const stats = [
                { label: 'Views', value: data.views },
                { label: 'Likes', value: data.likes },
                { label: 'Bookmarks', value: data.bookmarks },
                { label: 'Comments', value: data.comments },
                { label: 'Shares', value: data.shares }
            ];
            
            stats.forEach(stat => {
                if (stat.value) {
                    statsHtml += `<div class="stat-item"><strong>${stat.label}:</strong> ${formatNumber(stat.value)}</div>`;
                }
            });

            // Untuk tipe VIDEO
            if (data.type === 'video') {
                container.innerHTML = `
                    <div class="video-card">
                        <div class="profile">
                            <div class="avatar">${(data.username || 'U').charAt(0).toUpperCase()}</div>
                            <div class="user-info">
                                <div class="username">${escapeHTML(data.username || 'Unknown')}</div>
                                <div class="duration">⏱️ ${data.duration || 'Unknown'}</div>
                            </div>
                        </div>

                        ${statsHtml ? `<div class="stats">${statsHtml}</div>` : ''}

                        ${data.videos.nowm.length > 0 ? `
                        <div class="section">
                            <div class="section-title">📹 TANPA WATERMARK</div>
                            <div class="buttons">
                                ${data.videos.nowm.map((url, i) => `
                                    <a href="${url}" class="btn" target="_blank">Video ${i+1}</a>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}

                        ${data.videos.wm.length > 0 ? `
                        <div class="section">
                            <div class="section-title">💧 DENGAN WATERMARK</div>
                            <div class="buttons">
                                ${data.videos.wm.map((url, i) => `
                                    <a href="${url}" class="btn" target="_blank">Video ${i+1}</a>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}

                        ${data.audio.length > 0 ? `
                        <div class="section">
                            <div class="section-title">🎵 AUDIO MP3</div>
                            <div class="buttons">
                                ${data.audio.map((url, i) => `
                                    <a href="${url}" class="btn btn-audio" target="_blank">MP3 ${i+1}</a>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // Untuk tipe PHOTO (slide)
            else if (data.type === 'photo' && data.images.length > 0) {
                container.innerHTML = `
                    <div class="video-card">
                        <div class="profile">
                            <div class="avatar">${(data.username || 'U').charAt(0).toUpperCase()}</div>
                            <div class="user-info">
                                <div class="username">${escapeHTML(data.username || 'Unknown')}</div>
                                <div class="duration">📸 ${data.images.length} foto</div>
                            </div>
                        </div>

                        ${statsHtml ? `<div class="stats">${statsHtml}</div>` : ''}

                        <div class="images-grid">
                            ${data.images.map((url, i) => `
                                <div class="image-item">
                                    <img src="${url}" alt="Slide ${i+1}" loading="lazy">
                                    <a href="${url}" class="btn" target="_blank" style="border-radius:0; padding:8px;">Download</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('loading').classList.remove('active');
            container.classList.add('active');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
