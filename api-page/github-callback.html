<!DOCTYPE html>
<html>
<head>
    <title>GitHub Auth Callback</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            // Kirim code ke parent window
            window.opener.postMessage({ 
                type: 'github-auth', 
                code: code 
            }, window.location.origin);
            
            // Tampilkan pesan sukses
            document.body.innerHTML = '<h3>Authentication successful! You can close this window.</h3>';
            
            // Tutup window setelah 2 detik
            setTimeout(() => window.close(), 2000);
        } else {
            document.body.innerHTML = '<h3>Authentication failed!</h3>';
        }
    </script>
</body>
</html>
